<!DOCTYPE html>
<html lang="en" id="html-root">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | truncate: 160 }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v=3">
  <style>
    .nav-new-badge {
      display: inline-block;
      background: #f6c90e;
      color: #0f2744;
      font-size: 0.55rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      padding: 1px 5px;
      border-radius: 3px;
      vertical-align: middle;
      margin-left: 3px;
      line-height: 1.6;
      text-transform: uppercase;
    }
  </style>
  <script>
    // Apply saved preference before paint to avoid flash
    (function() {
      var saved = localStorage.getItem('theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved === 'dark' || (!saved && prefersDark)) {
        document.documentElement.classList.add('dark');
      } else if (saved === 'light') {
        document.documentElement.classList.add('light');
      }
    })();
  </script>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#1a3a5c">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5549175788718429" crossorigin="anonymous"></script>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a class="site-title" href="{{ '/' | relative_url }}">
      <img src="/assets/images/logo-light.svg" alt="Asia Tech Feed" class="site-logo site-logo-light">
      <img src="/assets/images/logo-dark.svg" alt="Asia Tech Feed" class="site-logo site-logo-dark">
    </a>
    <button class="dark-toggle" id="dark-toggle" onclick="toggleDark()" aria-label="Toggle dark mode">
      <span id="dark-icon">&#127769;</span> <span id="dark-label">Dark</span>
    </button>
  </div>
</header>

<nav class="site-nav">
  <div class="nav-inner">
    <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>Latest</a>
    <a href="{{ '/reports/' | relative_url }}" {% if page.url contains 'reports' %}class="active"{% endif %}>Reports <span class="nav-new-badge" id="reports-new-badge">NEW</span></a>
    <a href="{{ '/archive' | relative_url }}" {% if page.url contains 'archive' %}class="active"{% endif %}>Archive</a>
    <a href="{{ '/search' | relative_url }}" {% if page.url contains 'search' %}class="active"{% endif %}>Search</a>
    <a href="{{ '/about' | relative_url }}" {% if page.url contains 'about' %}class="active"{% endif %}>About</a>
    <a href="{{ '/contact' | relative_url }}" {% if page.url contains 'contact' %}class="active"{% endif %}>Contact</a>
  </div>
</nav>

<!-- Stock Ticker -->
<div id="ticker-wrap" style="background:var(--card-bg,#fff);border-bottom:1px solid var(--border,#dde3ec);overflow:hidden;min-height:46px;"></div>

<main>
  {{ content }}
</main>

<footer>
  <p>{{ site.title }} &middot; Auto-updated daily via GitHub Actions &middot; Filtered for Asia</p>
  <p>Keywords: Semiconductor &middot; Electronics &middot; Logistics &middot; Pharmaceutical &middot; Biotechnology &middot; AI &middot; Machine Vision &middot; Automation</p>
</footer>

<script>
// Stock ticker
var TICKER_SYMBOLS = [
  {"proName":"NASDAQ:NVDA","title":"Nvidia"},
  {"proName":"NASDAQ:MU","title":"Micron"},
  {"proName":"NYSE:TSM","title":"TSMC"},
  {"proName":"NASDAQ:ASML","title":"ASML"},
  {"proName":"NASDAQ:AMD","title":"AMD"},
  {"proName":"NASDAQ:AVGO","title":"Broadcom"},
  {"proName":"NASDAQ:QCOM","title":"Qualcomm"},
  {"proName":"NASDAQ:AMAT","title":"Applied Materials"},
  {"proName":"NASDAQ:INTC","title":"Intel"},
  {"proName":"NASDAQ:TXN","title":"Texas Instruments"}
];

function renderTicker() {
  var wrap = document.getElementById('ticker-wrap');
  if (!wrap) return;
  wrap.innerHTML = '';
  var isDark = document.documentElement.classList.contains('dark');
  var container = document.createElement('div');
  container.className = 'tradingview-widget-container';
  var inner = document.createElement('div');
  inner.className = 'tradingview-widget-container__widget';
  container.appendChild(inner);
  var script = document.createElement('script');
  script.type = 'text/javascript';
  script.src = 'https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js';
  script.async = true;
  script.innerHTML = JSON.stringify({
    symbols: TICKER_SYMBOLS,
    showSymbolLogo: true,
    isTransparent: true,
    displayMode: "adaptive",
    colorTheme: isDark ? "dark" : "light",
    locale: "en"
  });
  container.appendChild(script);
  wrap.appendChild(container);
}

// Dark mode toggle
function toggleDark() {
  var html = document.documentElement;
  var isDark = html.classList.contains('dark');
  if (isDark) {
    html.classList.remove('dark');
    html.classList.add('light');
    localStorage.setItem('theme', 'light');
  } else {
    html.classList.remove('light');
    html.classList.add('dark');
    localStorage.setItem('theme', 'dark');
  }
  updateToggleLabel();
  renderTicker();
}

function updateToggleLabel() {
  var isDark = document.documentElement.classList.contains('dark');
  var icon = document.getElementById('dark-icon');
  var label = document.getElementById('dark-label');
  if (icon) icon.innerHTML = isDark ? '&#9728;&#xFE0F;' : '&#127769;';
  if (label) label.textContent = isDark ? 'Light' : 'Dark';
}

document.addEventListener('DOMContentLoaded', function() {
  updateToggleLabel();
  renderTicker();
});

// Auto-hide "NEW" badge after 30 days
(function() {
  var badge = document.getElementById('reports-new-badge');
  if (!badge) return;
  var first = localStorage.getItem('reports-tab-first-seen');
  if (!first) { localStorage.setItem('reports-tab-first-seen', Date.now()); return; }
  if (Date.now() - parseInt(first) > 30 * 24 * 60 * 60 * 1000) badge.style.display = 'none';
})();

// Keyword filter
function filterTable(keyword) {
  const rows = document.querySelectorAll('.news-table tbody tr');
  const btns = document.querySelectorAll('.filter-btn');
  btns.forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');

  rows.forEach(row => {
    if (!keyword || keyword === 'all') {
      row.style.display = '';
    } else {
      const text = row.innerText.toLowerCase();
      row.style.display = text.includes(keyword.toLowerCase()) ? '' : 'none';
    }
  });
}

// CSV download
function downloadCSV() {
  const table = document.querySelector('.news-table');
  if (!table) return;
  let csv = [];
  const rows = table.querySelectorAll('tr');
  rows.forEach(row => {
    const cols = row.querySelectorAll('th, td');
    const rowData = Array.from(cols).map(col => {
      const link = col.querySelector('a');
      let text = link && col.classList.contains('col-link') ? link.href : col.innerText;
      return '"' + text.replace(/"/g, '""').replace(/\n/g, ' ') + '"';
    });
    csv.push(rowData.join('\t'));
  });
  const blob = new Blob([csv.join('\n')], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'asia-news-' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
}
</script>

</body>
</html>
