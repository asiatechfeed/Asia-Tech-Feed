---
layout: default
---
<div class="post-header">
  <h1>{{ page.title }}</h1>
  <div class="post-meta">
    <span>📅 {{ page.date | date: "%B %d, %Y" }}</span>
    <span>📰 {{ page.articles_count | default: 0 }} articles</span>
    <span>🌏 Southeast Asia Focus</span>
  </div>
</div>

<div class="actions-bar">
  <a href="{{ page.csv_file | relative_url }}" class="btn-download" download>
    ⬇ Download for Google Sheets (.tsv)
  </a>
</div>
