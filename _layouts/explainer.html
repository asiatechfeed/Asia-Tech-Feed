---
layout: default
---
<div class="post-body explainer-page">

  <div class="post-header explainer-header">
    <span class="explainer-badge">&#128218; Explainer</span>
    {% if page.tags %}
    <div class="explainer-tags">
      {% for tag in page.tags %}<span class="explainer-tag">{{ tag }}</span>{% endfor %}
    </div>
    {% endif %}
    <h1>{{ page.title }}</h1>
    <div class="post-meta">
      <span>&#128197; {{ page.date | date: "%B %d, %Y" }}</span>
      {% if page.author %}<span>&#128100; {{ page.author }}</span>{% endif %}
    </div>
  </div>

  <div class="explainer-content">
    {{ content }}
  </div>

</div>
