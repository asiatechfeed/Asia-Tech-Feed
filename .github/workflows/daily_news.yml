name: Daily Asia Tech News Digest

on:
  schedule:
    # Runs at 23:58 UTC = 07:58 AM Singapore Time (UTC+8), every day
    - cron: "58 23 * * *"
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Publish directly (true) or send notification email (false)"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Python setup ──────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      # ── 3. Run scraper ───────────────────────────────────────────────────
      - name: Run news scraper
        id: run_scraper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/fetch_news.py

          if [ -f "/tmp/no_articles.flag" ]; then
            echo "has_articles=false" >> $GITHUB_OUTPUT
            echo "article_count=0" >> $GITHUB_OUTPUT
            echo "digest_date=" >> $GITHUB_OUTPUT
          else
            COUNT=$(python -c "import json; d=json.load(open('_digest_meta.json')); print(d['count'])")
            DATE=$(python -c "import json; d=json.load(open('_digest_meta.json')); print(d['date'])")
            echo "has_articles=true" >> $GITHUB_OUTPUT
            echo "article_count=$COUNT" >> $GITHUB_OUTPUT
            echo "digest_date=$DATE" >> $GITHUB_OUTPUT
          fi

      # ── 4. Stop if no articles ───────────────────────────────────────────
      - name: Skip if no articles
        if: steps.run_scraper.outputs.has_articles == 'false'
        run: |
          echo "No matching articles found today. Skipping publish."
          exit 0

      # ── 5. Commit directly to main ───────────────────────────────────────
      - name: Commit digest to main
        if: steps.run_scraper.outputs.has_articles == 'true'
        run: |
          DATE="${{ steps.run_scraper.outputs.digest_date }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _posts/ assets/data/ _data/ _digest_meta.json
          # Only commit if there are changes
          git diff --cached --quiet || git commit -m "📰 News digest $DATE (${{ steps.run_scraper.outputs.article_count }} articles)"
          git push origin main

      # ── 6. Optional notification email (manual trigger only) ─────────────
      - name: Send notification email
        if: >
          steps.run_scraper.outputs.has_articles == 'true' &&
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.force_publish != 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          to: ${{ secrets.APPROVAL_EMAIL }}
          from: "Asia News Feed <${{ secrets.GMAIL_USERNAME }}>"
          subject: "✅ Asia Tech News published — ${{ steps.run_scraper.outputs.digest_date }} (${{ steps.run_scraper.outputs.article_count }} articles)"
          html_body: file://_email_preview.html
          priority: normal

      # ── 7. Build Jekyll site ─────────────────────────────────────────────
      - name: Setup Ruby
        if: steps.run_scraper.outputs.has_articles == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Build Jekyll site
        if: steps.run_scraper.outputs.has_articles == 'true'
        run: bundle exec jekyll build --destination ./_site
        env:
          JEKYLL_ENV: production

      # ── 8. Deploy to GitHub Pages ────────────────────────────────────────
      - name: Deploy to GitHub Pages
        if: steps.run_scraper.outputs.has_articles == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          commit_message: "🚀 Deploy digest ${{ steps.run_scraper.outputs.digest_date }} (${{ steps.run_scraper.outputs.article_count }} articles)"
