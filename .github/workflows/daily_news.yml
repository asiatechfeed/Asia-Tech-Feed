name: Daily Asia Tech News Digest

on:
  schedule:
    # Runs at 02:00 UTC = 10:00 AM Singapore Time, every day
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Skip email approval and publish directly"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch-and-stage:
    runs-on: ubuntu-latest
    outputs:
      has_articles: ${{ steps.run_scraper.outputs.has_articles }}
      article_count: ${{ steps.run_scraper.outputs.article_count }}
      digest_date: ${{ steps.run_scraper.outputs.digest_date }}
      pr_number: ${{ steps.create_pr.outputs.pull-request-number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run news scraper
        id: run_scraper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/fetch_news.py

          if [ -f "/tmp/no_articles.flag" ]; then
            echo "has_articles=false" >> $GITHUB_OUTPUT
            echo "article_count=0" >> $GITHUB_OUTPUT
          else
            COUNT=$(python -c "import json; d=json.load(open('_digest_meta.json')); print(d['count'])")
            DATE=$(python -c "import json; d=json.load(open('_digest_meta.json')); print(d['date'])")
            echo "has_articles=true" >> $GITHUB_OUTPUT
            echo "article_count=$COUNT" >> $GITHUB_OUTPUT
            echo "digest_date=$DATE" >> $GITHUB_OUTPUT
          fi

      - name: Skip if no articles
        if: steps.run_scraper.outputs.has_articles == 'false'
        run: |
          echo "No matching articles found today. Skipping PR creation."

      - name: Create draft branch
        if: steps.run_scraper.outputs.has_articles == 'true'
        run: |
          DATE="${{ steps.run_scraper.outputs.digest_date }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "news/$DATE"
          git add _posts/ assets/data/ -f _digest_meta.json
          git commit -m "📰 News digest $DATE (${{ steps.run_scraper.outputs.article_count }} articles)"
          git push origin "news/$DATE" --force

      - name: Build PR description
        if: steps.run_scraper.outputs.has_articles == 'true'
        id: build_pr_body
        run: |
          python - <<'EOF'
          import json
          meta = json.load(open("_digest_meta.json"))
          lines = [
            f"## 📰 Asia Tech News Digest — {meta['date']}",
            f"",
            f"**{meta['count']} articles** from {len(meta['sources'])} sources: {', '.join(meta['sources'])}",
            f"",
            f"### Top articles in this digest:",
          ]
          for a in meta["articles"]:
            lines.append(f"- [{a['title']}]({a['url']}) — *{a['source']}*")
          lines += [
            "",
            "---",
            "**To publish:** Merge this PR.",
            "**To skip:** Close without merging.",
            "",
            "> Auto-generated by Asia Tech News Feed GitHub Actions",
          ]
          body = "\n".join(lines)
          with open("/tmp/pr_body.txt", "w") as f:
            f.write(body)
          print("PR body written.")
          EOF

      - name: Create Pull Request
        if: steps.run_scraper.outputs.has_articles == 'true'
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE="${{ steps.run_scraper.outputs.digest_date }}"
          PR_URL=$(gh pr create \
            --base main \
            --head "news/$DATE" \
            --title "📰 News Digest — $DATE (${{ steps.run_scraper.outputs.article_count }} articles)" \
            --body-file /tmp/pr_body.txt \
            --label "auto-news" 2>/dev/null || \
            gh pr view "news/$DATE" --json url --jq '.url' 2>/dev/null || echo "")
          PR_NUMBER=$(echo "$PR_URL" | grep -o '[0-9]*$')
          echo "pull-request-number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "PR: $PR_URL (number: $PR_NUMBER)"

      - name: Send approval email
        if: >
          steps.run_scraper.outputs.has_articles == 'true' &&
          github.event.inputs.force_publish != 'true' &&
          github.event_name != 'schedule'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          to: ${{ secrets.APPROVAL_EMAIL }}
          from: "Asia News Feed <${{ secrets.GMAIL_USERNAME }}>"
          subject: "📋 [APPROVAL NEEDED] Asia Tech News — ${{ steps.run_scraper.outputs.digest_date }} (${{ steps.run_scraper.outputs.article_count }} articles)"
          html_body: file://_email_preview.html
          priority: normal

      - name: Auto-merge if force_publish
        if: >
          steps.run_scraper.outputs.has_articles == 'true' &&
          (github.event.inputs.force_publish == 'true' || github.event_name == 'schedule') &&
          steps.create_pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh pr merge ${{ steps.create_pr.outputs.pull-request-number }} \
            --merge --delete-branch \
            --subject "📰 Auto-publish: News Digest ${{ steps.run_scraper.outputs.digest_date }}"
