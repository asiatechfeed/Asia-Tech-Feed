name: Daily Asia Tech News Digest

on:
  schedule:
    # Runs at 00:00 UTC = 8:00 AM Singapore Time, every day
    - cron: "0 0 * * *"→ Runs at 02:00
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Publish directly (true) or send notification email (false)"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Python setup ──────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      # ── 3. Fetch stock prices ─────────────────────────────────────────────
      - name: Fetch stock prices
        run: python scripts/fetch_stocks.py

      # ── 4. Run scraper ───────────────────────────────────────────────────
      - name: Run news scraper
        id: run_scraper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/fetch_news.py

          if [ -f "/tmp/no_articles.flag" ]; then
            echo "has_articles=false" >> $GITHUB_OUTPUT
            echo "article_count=0" >> $GITHUB_OUTPUT
            echo "digest_date=" >> $GITHUB_OUTPUT
          else
            COUNT=$(python -c "import json; d=json.load(open('_digest_meta.json')); print(d['count'])")
            DATE=$(python -c "import json; d=json.load(open('_digest_meta.json')); print(d['date'])")
            echo "has_articles=true" >> $GITHUB_OUTPUT
