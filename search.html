---
layout: default
title: Search
---

<div class="search-page">
  <div class="search-header">
    <h1>Search News</h1>
    <p class="search-sub">Search across all current and archived articles</p>
    <div class="search-box-wrap">
      <input id="searchInput" type="text" placeholder="Search topics, sources, keywords" autocomplete="off" autofocus />
      <span class="search-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
    </div>
    <div id="searchMeta" class="search-meta"></div>
  </div>

  <div id="resultsWrap">
    <div id="noQuery" class="search-hint">Start typing to search articles</div>
    <div id="noResults" class="search-hint" style="display:none">No articles found. Try different keywords.</div>
    <table id="resultsTable" class="news-table" style="display:none">
      <thead>
        <tr>
          <th class="col-date">Date</th>
          <th class="col-source">Source</th>
          <th class="col-title">Title</th>
          <th class="col-summary">Summary</th>
          <th class="col-tags">Topics</th>
        </tr>
      </thead>
      <tbody id="resultsBody"></tbody>
    </table>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
