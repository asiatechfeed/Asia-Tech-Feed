title: Asia Tech Feed
description: Daily Asia tech news digest covering semiconductors, electronics, logistics, pharma, biotech, AI & automation
baseurl: ""
url: "https://asiatechfeed.com"

# Build settings
theme: null
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate

paginate: 10
paginate_path: "/page/:num/"

# Permalink
permalink: /:year/:month/:day/:title/

# Exclude from build
exclude:
  - scripts/
  - Gemfile
  - Gemfile.lock
  - README.md
  - "*.sh"
  - vendor/

# Collections
collections:
  drafts:
    output: false
  explainers:
    output: true
    permalink: /explainers/:title/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "explainers"
    values:
      layout: "explainer"

markdown: kramdown
highlighter: rouge
encoding: utf-8
